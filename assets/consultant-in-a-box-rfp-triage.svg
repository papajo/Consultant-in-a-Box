<svg width="1600" height="950" viewBox="0 0 1600 950" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="950" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#F3F1EB"/>
    </linearGradient>
    <linearGradient id="nav" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F2937"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="decision" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ECFDF5"/>
      <stop offset="1" stop-color="#DCFCE7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="950" fill="url(#bg)"/>

  <!-- top bar -->
  <rect width="1600" height="86" fill="url(#nav)"/>
  <circle cx="52" cy="43" r="18" fill="#F59E0B"/>
  <text x="82" y="52" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="32" font-weight="700">Consultant-in-a-Box</text>
  <g fill="#E2E8F0" font-family="Arial, sans-serif" font-size="18" font-weight="600">
    <rect x="730" y="18" width="110" height="52" rx="12" fill="#1E293B"/>
    <text x="780" y="51" text-anchor="middle">Triage</text>
    <rect x="856" y="18" width="140" height="52" rx="12" fill="#1E293B"/>
    <text x="926" y="51" text-anchor="middle">Pipeline</text>
    <rect x="1008" y="18" width="130" height="52" rx="12" fill="#1E293B"/>
    <text x="1073" y="51" text-anchor="middle">Compare</text>
  </g>
  <rect x="1390" y="18" width="170" height="52" rx="14" fill="#F59E0B"/>
  <text x="1475" y="52" text-anchor="middle" fill="#1F2937" font-family="Arial, sans-serif" font-size="18" font-weight="700">AI Copilot</text>

  <!-- main card -->
  <g filter="url(#shadow)">
    <rect x="70" y="118" width="1460" height="770" rx="30" fill="#F8F6F2" stroke="#E7E5E4"/>
  </g>

  <!-- left pane: document -->
  <rect x="100" y="156" width="770" height="700" rx="26" fill="#FFFFFF" stroke="#E7E5E4"/>
  <rect x="130" y="188" width="316" height="42" rx="12" fill="#F3F4F6"/>
  <text x="148" y="215" fill="#374151" font-family="Arial, sans-serif" font-size="18" font-weight="700">Opportunity document</text>
  <rect x="130" y="248" width="690" height="432" rx="18" fill="#FFF9F0" stroke="#F2E6D7"/>
  <text x="160" y="286" fill="#374151" font-family="Arial, sans-serif" font-size="24" font-weight="700">City of Seattle – Data &amp; AI Transformation Services</text>
  <text x="160" y="325" fill="#6B7280" font-family="Arial, sans-serif" font-size="17">RFP Summary</text>
  <text x="160" y="360" fill="#4B5563" font-family="Arial, sans-serif" font-size="16">The City seeks a partner to modernize citizen services, improve data governance,</text>
  <text x="160" y="385" fill="#4B5563" font-family="Arial, sans-serif" font-size="16">and deploy AI-assisted workflows across permitting, procurement, and community</text>
  <text x="160" y="410" fill="#4B5563" font-family="Arial, sans-serif" font-size="16">engagement. Experience with public-sector transformation is required and must be</text>
  <text x="160" y="435" fill="#4B5563" font-family="Arial, sans-serif" font-size="16">backed by measurable outcomes.</text>

  <rect x="160" y="470" width="180" height="52" rx="12" fill="#F3E8FF"/>
  <text x="179" y="503" fill="#7C3AED" font-family="Arial, sans-serif" font-size="16" font-weight="700">AI governance</text>
  <rect x="360" y="470" width="180" height="52" rx="12" fill="#DCFCE7"/>
  <text x="382" y="503" fill="#15803D" font-family="Arial, sans-serif" font-size="16" font-weight="700">Public sector</text>
  <rect x="560" y="470" width="190" height="52" rx="12" fill="#FEF3C7"/>
  <text x="582" y="503" fill="#B45309" font-family="Arial, sans-serif" font-size="16" font-weight="700">Data strategy</text>

  <rect x="130" y="706" width="200" height="56" rx="14" fill="#111827"/>
  <text x="230" y="742" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="700">Run triage</text>
  <rect x="350" y="706" width="170" height="56" rx="14" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="435" y="742" text-anchor="middle" fill="#3F3F46" font-family="Arial, sans-serif" font-size="18" font-weight="600">Reset</text>

  <!-- right panel -->
  <rect x="905" y="156" width="560" height="700" rx="26" fill="#FBFAF8" stroke="#E7E5E4"/>
  <text x="940" y="200" fill="#1F2937" font-family="Arial, sans-serif" font-size="24" font-weight="700">Agent activity pipeline</text>

  <rect x="940" y="224" width="500" height="14" rx="7" fill="#E7E5E4"/>
  <rect x="940" y="224" width="420" height="14" rx="7" fill="#F59E0B"/>

  <g font-family="Arial, sans-serif" fill="#4B5563">
    <text x="940" y="272" font-size="15" font-weight="700">Extract</text>
    <text x="940" y="294" font-size="14">Parsed scope, constraints, and deliverables</text>

    <text x="940" y="344" font-size="15" font-weight="700">Fit check</text>
    <text x="940" y="366" font-size="14">Matched 6 evidence points to public-sector AI capabilities</text>

    <text x="940" y="416" font-size="15" font-weight="700">Research</text>
    <text x="940" y="438" font-size="14">Grounded client context and prior wins from public references</text>

    <text x="940" y="488" font-size="15" font-weight="700">Risk review</text>
    <text x="940" y="510" font-size="14">Identified staffing dependencies and procurement risk</text>

    <text x="940" y="560" font-size="15" font-weight="700">Proposal draft</text>
    <text x="940" y="582" font-size="14">Composed pitch narrative and evidence-backed bid narrative</text>
  </g>

  <g>
    <circle cx="1120" cy="258" r="9" fill="#F59E0B"/>
    <circle cx="1120" cy="330" r="9" fill="#F59E0B"/>
    <circle cx="1120" cy="402" r="9" fill="#F59E0B"/>
    <circle cx="1120" cy="474" r="9" fill="#10B981"/>
    <circle cx="1120" cy="546" r="9" fill="#10B981"/>
    <line x1="1120" y1="267" x2="1120" y2="321" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <line x1="1120" y1="339" x2="1120" y2="393" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <line x1="1120" y1="411" x2="1120" y2="465" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <line x1="1120" y1="483" x2="1120" y2="537" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- decision patch -->
  <g>
    <rect x="940" y="620" width="500" height="190" rx="24" fill="url(#decision)" stroke="#86EFAC"/>
    <text x="970" y="660" fill="#166534" font-family="Arial, sans-serif" font-size="17" font-weight="700">Decision</text>
    <text x="970" y="710" fill="#14532D" font-family="Arial, sans-serif" font-size="42" font-weight="800">GO</text>
    <text x="1058" y="709" fill="#166534" font-family="Arial, sans-serif" font-size="22" font-weight="700">86 / 100</text>
    <text x="970" y="750" fill="#166534" font-family="Arial, sans-serif" font-size="18">High strategic fit with measurable public-sector outcomes</text>
    <rect x="970" y="772" width="220" height="18" rx="9" fill="#BBF7D0"/>
    <rect x="970" y="772" width="180" height="18" rx="9" fill="#16A34A"/>
  </g>

  <!-- tab row -->
  <g>
    <rect x="130" y="112" width="140" height="34" rx="10" fill="#111827"/>
    <text x="200" y="135" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="12" font-weight="700">Evidence Fit Matrix</text>
    <rect x="280" y="112" width="170" height="34" rx="10" fill="#F3F4F6"/>
    <text x="365" y="135" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12" font-weight="700">Client diligence</text>
    <rect x="462" y="112" width="165" height="34" rx="10" fill="#F3F4F6"/>
    <text x="545" y="135" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12" font-weight="700">Risk matrix</text>
    <rect x="639" y="112" width="170" height="34" rx="10" fill="#FEF3C7"/>
    <text x="724" y="135" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="12" font-weight="700">Proposal draft</text>
  </g>
</svg>
